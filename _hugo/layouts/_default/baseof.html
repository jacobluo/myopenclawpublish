<!doctype html>
<html lang="{{ site.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/research-brief.css">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Params.summary }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}{{ end }}">
    {{- partial "analytics.html" . }}
  </head>
  <body class="portal-page {{ if .IsHome }}portal-home{{ else }}portal-section-{{ .Section }}{{ end }}">
    <header class="portal-top">
      <div class="portal-wrap portal-top-inner">
        <a class="portal-identity" href="/">
          <span class="portal-logo">CP</span>
          <span>
            <strong>CoBuddy Pages</strong>
            <span>Daily · Research · Deliverables</span>
          </span>
        </a>
        <nav class="portal-nav" aria-label="站点导航">
          <a href="/"{{ if .IsHome }} class="current"{{ end }}>Overview</a>
          <a href="/research/"{{ if eq .Section "research" }} class="current"{{ end }}>Research</a>
          <a href="/daily/"{{ if eq .Section "daily" }} class="current"{{ end }}>Daily</a>
          <a href="/deliverables/"{{ if eq .Section "deliverables" }} class="current"{{ end }}>Deliverables</a>
        </nav>
      </div>
    </header>
    <main class="portal-wrap">
      {{- block "main" . }}{{ end }}
      <footer class="portal-footer">CoBuddy Pages · Published with Hugo · pages.cobuddy.cc</footer>
    </main>
    <script src="/assets/research-brief.js" defer></script>
  </body>
</html>
