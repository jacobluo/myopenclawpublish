<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenClaw Publish</title>
    <meta name="description" content="OpenClaw 发布内容索引。">
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --paper: #ffffff;
        --text: #1f2933;
        --muted: #64748b;
        --line: #d8dee8;
        --accent: #0f766e;
        --link: #075985;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 42px 0 56px;
      }

      header {
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(32px, 5vw, 52px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      p {
        margin: 0;
      }

      .muted {
        color: var(--muted);
      }

      .year {
        margin-top: 30px;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 20px;
        letter-spacing: 0;
      }

      .post {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 18px;
        border-top: 1px solid var(--line);
        padding: 18px 0;
      }

      time {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      a {
        color: var(--link);
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.18em;
      }

      .title {
        font-size: 18px;
        font-weight: 650;
      }

      .summary {
        margin-top: 4px;
        color: var(--muted);
      }

      footer {
        margin-top: 32px;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 620px) {
        .post {
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>OpenClaw Publish</h1>
        <p class="muted">按时间归档的公开阅读页面。Follow 更新会进入当天目录。</p>
      </header>

      <section class="year" aria-labelledby="y2026">
        <h2 id="y2026">2026</h2>
        <article class="post">
          <time datetime="2026-06-15">2026-06-15</time>
          <div>
            <a class="title" href="./2026/06/15/tencent-weixin-agentic-ai/">Tencent: Weixin agentic AI on the horizon?</a>
            <p class="summary">公开互联网线索整理：Tencent, Weixin, agentic AI, Bernstein, A2A。</p>
          </div>
        </article>
      </section>

      <footer>Repository: jacobluo/myopenclawpublish</footer>
    </main>
  </body>
</html>
